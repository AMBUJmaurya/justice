<div class="ai-chat-widget" id="aiChatWidget" aria-live="polite">
  <button class="ai-chat-fab" id="aiChatFab" type="button" aria-label="Open Court Assistant">
    <i class="fas fa-robot"></i>
  </button>

  <div class="ai-chat-panel" id="aiChatPanel" hidden>
    <div class="ai-chat-header">
      <div class="ai-chat-title">
        <div class="ai-chat-name">Court Assistant</div>
        <div class="ai-chat-subtitle">General information (not legal advice)</div>
      </div>
      <button class="ai-chat-close" id="aiChatClose" type="button" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="ai-chat-messages" id="aiChatMessages">
      <div class="ai-chat-msg ai-chat-msg--bot">
        Ask about court process, documents, hearings, bail, dates, or next steps. Do not share passwords/OTP or sensitive personal details.
      </div>
    </div>

    <form class="ai-chat-form" id="aiChatForm" method="post" novalidate>
      <input class="ai-chat-input" id="aiChatInput" type="text" placeholder="Type your question…" autocomplete="off" required />
      <button class="ai-chat-send" type="submit" aria-label="Send">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </div>
</div>
